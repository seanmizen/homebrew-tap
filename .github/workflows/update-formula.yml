name: update formula

# Checks seanmizen/shist for a newer release and rewrites the formula.
# Uses the built-in GITHUB_TOKEN - no personal access token needed.
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "shist tag to pin (blank = latest release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: regenerate formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-formula.sh "${{ inputs.tag }}"

      - name: commit if changed
        run: |
          if git diff --quiet -- Formula/shist.rb; then
            echo "formula already up to date"
            exit 0
          fi
          version=$(grep -m1 -oE 'download/v[^/]+' Formula/shist.rb | cut -d/ -f2)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "shist $version" -- Formula/shist.rb
          git push
